  function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); }
  function lget(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }
  function lset(k, v){ try { localStorage.setItem(k, v); } catch(e) {} }
  function open(pass){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function(k){ return crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256' }, k, { name:'AES-GCM', length:256 }, false, ['decrypt']); })
      .then(function(key){ return crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(IV) }, key, b64(DATA)); })
      .then(function(plain){
        return crypto.subtle.digest('SHA-256', enc.encode('kyoto-shiori-2026:' + pass)).then(function(h){
          var html = new TextDecoder().decode(plain).replace('__KTOKEN__', hex(h).slice(0, 40));
          lset('kyoto-pass', pass);
          document.open(); document.write(html); document.close();
        });
      });
  }
  var f = document.getElementById('f'), msg = document.getElementById('msg'), ld = document.getElementById('ld');
  var nm = document.getElementById('nm'); nm.value = lget('kyoto-name') || '';
  function busy(on){ f.style.display = on ? 'none' : 'flex'; ld.style.display = on ? 'block' : 'none'; }
  f.addEventListener('submit', function(e){
    e.preventDefault();
    var pass = document.getElementById('pw').value.trim(); if (!pass) return;
    if (nm.value.trim()) lset('kyoto-name', nm.value.trim());
    msg.textContent = ''; busy(true);
    open(pass).catch(function(){ busy(false); msg.textContent = '合言葉がちがうみたいです'; });
  });
  var saved = lget('kyoto-pass');
  if (saved) { busy(true); open(saved).catch(function(){ busy(false); lset('kyoto-pass', ''); }); }
